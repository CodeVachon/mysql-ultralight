[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server", "crates/cli", "crates/conformance"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CodeVachon/mysql-ultralight"

[workspace.dependencies]
mysql-ultralight-protocol = { path = "crates/protocol" }
mysql-ultralight-server = { path = "crates/server" }
tokio = { version = "1", default-features = false }
sha1 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
