name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing useful left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A test-only database engine has no secrets to protect in its own build, but
  # a failed build should be loud rather than silently degraded.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      # The gate runs the npm package's tests and Fallow, so the version of
      # node is part of what is being checked rather than whatever the runner
      # image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The example installs Prisma; cached, that is about a second rather
          # than four.
          cache: npm
          cache-dependency-path: examples/*/package-lock.json

      - uses: Swatinem/rust-cache@v2

      # Installed via binstall so CI does not pay to compile them every run.
      # mdBook is here because the gate builds the docs site; `--require-tools`
      # would otherwise turn its absence into a failure rather than a skip.
      - name: Install analysis tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-audit,mdbook@0.5.4

      # The gate reports a missing install as a skip locally and a failure under
      # CI, so the example's dependencies have to be there before it runs.
      #
      # This used to pass --omit=optional, to stop a published platform package
      # from supplying a binary in place of the one this run builds. That is
      # already what MYSQL_ULTRALIGHT_BINARY does -- `resolveBinary` reads the
      # environment before it looks for a platform package -- so the flag was a
      # second guard on the same thing, and the composition is what broke:
      # --omit=optional is not selective, so it also withheld rollup's platform
      # binary and every vitest run died in `require`. One guard, asserted by a
      # test, rather than two that only agree by accident.
      - name: Install the examples' dependencies
        run: |
          for example in examples/*/; do
            npm ci --prefix "$example"
          done

      # The same script the pre-commit hook runs, so local and CI cannot drift.
      - name: Run checks
        run: ./scripts/check.sh

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Handles the Linux cross targets without a hand-rolled linker setup.
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          if [ "${{ runner.os }}" = "Linux" ] && [ "${{ matrix.target }}" != "x86_64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }}
          fi
