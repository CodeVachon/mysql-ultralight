name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing useful left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A test-only database engine has no secrets to protect in its own build, but
  # a failed build should be loud rather than silently degraded.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      # Installed via binstall so CI does not pay to compile them every run.
      - name: Install analysis tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-audit

      # The same script the pre-commit hook runs, so local and CI cannot drift.
      - name: Run checks
        run: ./scripts/check.sh

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Handles the Linux cross targets without a hand-rolled linker setup.
      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: |
          if [ "${{ runner.os }}" = "Linux" ] && [ "${{ matrix.target }}" != "x86_64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }}
          fi
